<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>KURDIA ADMIN - Smart Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{
  --bg:#080b12;
  --panel:#111722;
  --panel2:#161e2b;
  --border:#202938;
  --text:#f5f5f5;
  --muted:#8e99aa;
  --accent:#9d1c32;
  --accent-hover:#b3223b;
  --success:#22c55e;
  --danger:#ef4444;
}

body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Vazirmatn",sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

button,input,textarea,select{font-family:inherit}
button{cursor:pointer;border:0;outline:none}

/* HEADER */
.topbar{
  height:60px;
  background:rgba(17,23,34,0.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  z-index:30;
  flex-shrink:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
}
.brand .logo{
  width:34px;
  height:34px;
  border-radius:9px;
  background:linear-gradient(135deg,var(--accent),#500e19);
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:15px;
}
.brand h1{
  font-size:14px;
  margin:0;
  font-weight:800;
}

.actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.btn{
  padding:7px 10px;
  border-radius:8px;
  background:var(--panel2);
  color:#fff;
  border:1px solid var(--border);
  font-size:11px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:.2s;
}
.btn-primary{background:var(--accent);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}

/* MAIN TABS CONTENT */
.tab-content{
  flex:1;
  overflow-y:auto;
  display:none;
  padding:16px;
}
.tab-content.active{
  display:flex;
  flex-direction:column;
}

/* SECTIONS TAB */
.pane-title{
  font-size:14px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.section-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  flex:1;
}

.sec-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:.2s;
}
.sec-card.active{border-color:var(--accent);background:rgba(157,28,50,0.14)}
.sec-card.hidden-sec{opacity:0.45}

.sec-card-info{
  display:flex;
  align-items:center;
  gap:12px;
}
.drag-handle{color:var(--muted);font-size:16px;cursor:grab}
.sec-card-name{font-size:13px;font-weight:600}
.sec-card-type{font-size:11px;color:var(--muted);display:block}

.sec-card-btns{display:flex;gap:6px}
.icon-btn{
  width:32px;
  height:32px;
  border-radius:8px;
  background:var(--panel2);
  color:#ccc;
  display:grid;
  place-items:center;
  font-size:12px;
}

/* PREVIEW TAB */
#tab-preview{
  padding:10px;
  align-items:center;
  background:#05070a;
}
.viewport-bar{
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:10px;
  width:100%;
}
.view-btn{
  padding:5px 12px;
  border-radius:7px;
  background:var(--panel);
  color:var(--muted);
  font-size:11px;
  border:1px solid var(--border);
}
.view-btn.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.site-frame{
  background:#080b12;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
  border:1px solid var(--border);
  width:100%;
  max-width:420px;
  overflow-y:auto;
  flex:1;
}

.live-sec{
  outline:2px solid transparent;
  transition:.15s;
  cursor:pointer;
}
.live-sec.selected{outline:2px solid var(--accent)}

.live-hero{
  padding:45px 18px;
  color:#fff;
  background-size:cover;
  background-position:center;
  text-align:right;
}
.live-badge{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  padding:4px 10px;
  border-radius:99px;
  font-size:11px;
  margin-bottom:10px;
}
.live-hero h2{font-size:24px;margin:0 0 8px;line-height:1.3}
.live-hero p{color:#d1d5db;font-size:13px;margin:0;line-height:1.6}

.live-trip{
  padding:24px 18px;
  background:rgba(22,30,43,0.6);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.trip-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}
.trip-box{
  background:var(--bg);
  padding:8px 10px;
  border-radius:8px;
  border:1px solid var(--border);
}
.trip-box span{font-size:10px;color:var(--muted);display:block}
.trip-box b{font-size:12px}

.live-steps{padding:24px 18px}
.step-item{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  background:var(--panel2);
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  font-size:12px;
}
.step-num{
  background:var(--accent);
  width:22px;
  height:22px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:700;
  flex-shrink:0;
}

.live-booking{
  padding:24px 18px;
  text-align:center;
  background:linear-gradient(180deg,transparent,rgba(157,28,50,0.12));
}

/* INSPECTOR TAB */
.form-group{margin-bottom:14px}
.form-group label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
  font-weight:600;
}
.input, .textarea, .select{
  width:100%;
  background:#0d121c;
  border:1px solid var(--border);
  color:#fff;
  border-radius:9px;
  padding:10px 12px;
  font-size:13px;
  outline:none;
}
.input:focus, .textarea:focus{border-color:var(--accent)}
.textarea{min-height:80px;resize:vertical}

.color-pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.color-ctrl{
  display:flex;
  align-items:center;
  gap:8px;
  background:#0d121c;
  padding:8px;
  border-radius:9px;
  border:1px solid var(--border);
}
.color-ctrl input[type=color]{
  width:34px;
  height:30px;
  border:0;
  border-radius:6px;
  background:none;
  cursor:pointer;
}

/* BOTTOM NAVIGATION (MOBILE FIRST) */
.bottom-nav{
  height:58px;
  background:rgba(17,23,34,0.98);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  flex-shrink:0;
  z-index:30;
}
.nav-tab{
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
}
.nav-tab.active{
  color:white;
  background:rgba(157,28,50,0.12);
  box-shadow:inset 0 3px 0 var(--accent);
}
.nav-tab-icon{font-size:16px}

/* TOAST */
.toast{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#17202d;
  color:#fff;
  border:1px solid var(--border);
  padding:10px 18px;
  border-radius:10px;
  font-size:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  opacity:0;
  transition:.25s ease;
  z-index:9999;
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">K</div>
    <div>
      <h1>KURDIA ADMIN</h1>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="undoBtn">↶</button>
    <button class="btn" id="redoBtn">↷</button>
    <button class="btn" id="saveDraftBtn">💾 پاشەکەوت</button>
    <button class="btn btn-primary" id="publishBtn">🚀 Publish</button>
  </div>
</header>

<!-- TAB 1: SECTIONS -->
<main class="tab-content active" id="tab-sections">
  <div class="pane-title">
    <span>بەشەکانی وێبسایت</span>
    <span id="secCounter" style="color:var(--accent);font-weight:900">4</span>
  </div>
  <div class="section-list" id="sectionList"></div>
  <button class="btn btn-primary" style="width:100%;margin-top:14px;padding:12px" id="addSectionBtn">＋ زیادکردنی بەش</button>
</main>

<!-- TAB 2: LIVE PREVIEW -->
<main class="tab-content" id="tab-preview">
  <div class="viewport-bar">
    <button class="view-btn active" data-view="mobile">📱 Mobile</button>
    <button class="view-btn" data-view="tablet">▣ Tablet</button>
    <button class="view-btn" data-view="desktop">🖥 Desktop</button>
  </div>
  <div class="site-frame" id="siteFrame">
    <div id="livePreview"></div>
  </div>
</main>

<!-- TAB 3: INSPECTOR -->
<main class="tab-content" id="tab-inspector">
  <div class="pane-title">
    <span>دەستکاریکردنی بەش</span>
    <span id="activeSecType" style="color:var(--accent)">هیچ</span>
  </div>
  <div id="inspectorContent"></div>
</main>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
  <button class="nav-tab active" data-target="tab-sections">
    <span class="nav-tab-icon">☰</span>
    بەشەکان
  </button>
  <button class="nav-tab" data-target="tab-preview">
    <span class="nav-tab-icon">👁</span>
    پێشبینین
  </button>
  <button class="nav-tab" data-target="tab-inspector">
    <span class="nav-tab-icon">⚙</span>
    دەستکاری
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";

const BIN_ID = "6ab7f417ac6210605af863a3";
const API_KEY = "$2a$10$8avc1KliyAqa2Nof1YPm8eks0PGlSxSbJse5LUrK5irHtbVfhu.WW";
const IMGBB_KEY = "c89b7b9f5eaae43bce82e66b4d3f572a";

const STORAGE_KEY = "kurdia_builder_draft_v3";
const PUBLISHED_KEY = "kurdia_builder_published_v3";

const DEFAULT_DATA = {
  gradColor1: "#9d1c32",
  gradColor2: "#111827",
  heroBadge: "KURDIA ADVENTURE",
  heroTitle: "ئەزموونی سروشت و شاخ لە کوردستان",
  heroSubtitle: "لەگەڵ ئێمە یادەوەریی تایبەت و سروشتی نەبینراو ببینە",
  heroImageUrl: "",
  bookingOpen: true,
  tripTitle: "گەشتی تایبەت",
  tripPrice: "50,000 IQD",
  tripDifficulty: "ئاسان",
  tripDuration: "1 ڕۆژ",
  tripTime: "06:00",
  tripLocation: "کوردستان",
  tripDesc: "گەشتێکی پڕ لە چێژ و بینینی دیمەنە ناوازەکانی سروشت.",
  step1: "پەیوەندی و ناونووسین",
  step2: "ئامادەکاری پێداویستییەکان",
  step3: "بەڕێکەوتن بەرەو شوێنی گەشت",
  step4: "چێژوەرگرتن لە سروشت",
  seoTitle: "KURDIA ADVENTURE",
  seoDescription: "گەشتی سروشت و شاخ لە کوردستان",
  socialImage: "",
  gallery: [],
  sections: [
    { id: "hero_1", type: "hero", title: "Hero", visible: true },
    { id: "trip_1", type: "trip", title: "گەشت", visible: true },
    { id: "services_1", type: "services", title: "هەنگاوەکان", visible: true },
    { id: "booking_1", type: "booking", title: "Booking", visible: true }
  ]
};

let state = loadInitialState();
let selectedId = state.sections[0]?.id || null;

let historyStack = [JSON.stringify(state)];
let historyIndex = 0;

function pushState(newState){
  if(historyIndex < historyStack.length - 1){
    historyStack = historyStack.slice(0, historyIndex + 1);
  }
  historyStack.push(JSON.stringify(newState));
  historyIndex++;
  state = newState;
  renderAll();
}

function undo(){
  if(historyIndex > 0){
    historyIndex--;
    state = JSON.parse(historyStack[historyIndex]);
    renderAll();
    toast("گەڕایەوە دواوە ↶");
  }
}

function redo(){
  if(historyIndex < historyStack.length - 1){
    historyIndex++;
    state = JSON.parse(historyStack[historyIndex]);
    renderAll();
    toast("چووە پێشەوە ↷");
  }
}

document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;

function loadInitialState(){
  try{
    const draft = localStorage.getItem(STORAGE_KEY);
    if(draft) return Object.assign({}, DEFAULT_DATA, JSON.parse(draft));
    const pub = localStorage.getItem(PUBLISHED_KEY);
    if(pub) return Object.assign({}, DEFAULT_DATA, JSON.parse(pub));
  }catch(e){}
  return structuredClone(DEFAULT_DATA);
}

// TAB SWITCHING LOGIC
document.querySelectorAll(".nav-tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.target).classList.add("active");
  };
});

function switchToInspector(secId){
  selectedId = secId;
  renderAll();
  document.querySelector('[data-target="tab-inspector"]').click();
}

function renderAll(){
  renderSectionList();
  renderLivePreview();
  renderInspector();
}

/* 1. SECTIONS LIST */
function renderSectionList(){
  const list = document.getElementById("sectionList");
  list.innerHTML = "";
  document.getElementById("secCounter").textContent = state.sections.length;

  state.sections.forEach((sec, idx)=>{
    const el = document.createElement("div");
    el.className = "sec-card " + (sec.id === selectedId ? "active ":"") + (!sec.visible ? "hidden-sec":"");
    el.draggable = true;

    el.innerHTML = `
      <div class="sec-card-info">
        <span class="drag-handle">☰</span>
        <div>
          <span class="sec-card-name">${escapeHtml(sec.title || sec.type)}</span>
          <span class="sec-card-type">${sec.type}</span>
        </div>
      </div>
      <div class="sec-card-btns">
        <button class="icon-btn edit-btn" title="دەستکاری">✏️</button>
        <button class="icon-btn vis-btn">${sec.visible ? "◉":"○"}</button>
        <button class="icon-btn del-btn">×</button>
      </div>
    `;

    el.querySelector(".edit-btn").onclick = (e)=>{
      e.stopPropagation();
      switchToInspector(sec.id);
    };

    el.onclick = ()=> switchToInspector(sec.id);

    el.querySelector(".vis-btn").onclick = (e)=>{
      e.stopPropagation();
      const updated = structuredClone(state);
      updated.sections[idx].visible = !updated.sections[idx].visible;
      pushState(updated);
    };

    el.querySelector(".del-btn").onclick = (e)=>{
      e.stopPropagation();
      if(state.sections.length <= 1) return toast("دەبێت لانیکەم یەک بەش بمێنێتەوە");
      const updated = structuredClone(state);
      updated.sections.splice(idx, 1);
      if(selectedId === sec.id) selectedId = updated.sections[0]?.id;
      pushState(updated);
    };

    // Drag
    el.ondragstart = (e)=>{ e.dataTransfer.setData("text/plain", sec.id); };
    el.ondragover = (e)=>{ e.preventDefault(); };
    el.ondrop = (e)=>{
      e.preventDefault();
      const fromId = e.dataTransfer.getData("text/plain");
      if(!fromId || fromId === sec.id) return;
      const updated = structuredClone(state);
      const fIdx = updated.sections.findIndex(x=>x.id === fromId);
      const tIdx = updated.sections.findIndex(x=>x.id === sec.id);
      const [moved] = updated.sections.splice(fIdx, 1);
      updated.sections.splice(tIdx, 0, moved);
      pushState(updated);
    };

    list.appendChild(el);
  });
}

/* 2. LIVE PREVIEW */
function renderLivePreview(){
  const live = document.getElementById("livePreview");
  live.innerHTML = "";

  state.sections.filter(s => s.visible).forEach(sec => {
    const wrap = document.createElement("div");
    wrap.className = "live-sec " + (sec.id === selectedId ? "selected" : "");
    wrap.onclick = ()=> switchToInspector(sec.id);

    if(sec.type === "hero"){
      const bgImg = state.heroImageUrl ? `url('${state.heroImageUrl}')` : `none`;
      wrap.innerHTML = `
        <div class="live-hero" style="background:linear-gradient(135deg, ${state.gradColor1}dd, ${state.gradColor2}ee), ${bgImg} center/cover;">
          <span class="live-badge">${escapeHtml(state.heroBadge)}</span>
          <h2>${escapeHtml(state.heroTitle)}</h2>
          <p>${escapeHtml(state.heroSubtitle)}</p>
        </div>
      `;
    }else if(sec.type === "trip"){
      wrap.innerHTML = `
        <div class="live-trip">
          <h3 style="margin:0 0 10px">${escapeHtml(state.tripTitle)}</h3>
          <p style="color:var(--muted);font-size:13px;margin:0">${escapeHtml(state.tripDesc)}</p>
          <div class="trip-grid">
            <div class="trip-box"><span>نرخ</span><b>${escapeHtml(state.tripPrice)}</b></div>
            <div class="trip-box"><span>ئاست</span><b>${escapeHtml(state.tripDifficulty)}</b></div>
            <div class="trip-box"><span>ماوە</span><b>${escapeHtml(state.tripDuration)}</b></div>
            <div class="trip-box"><span>کات</span><b>${escapeHtml(state.tripTime)}</b></div>
            <div class="trip-box"><span>شوێن</span><b>${escapeHtml(state.tripLocation)}</b></div>
          </div>
        </div>
      `;
    }else if(sec.type === "services"){
      wrap.innerHTML = `
        <div class="live-steps">
          <h4 style="margin:0 0 12px">قۆناغەکانی گەشت</h4>
          <div class="step-item"><span class="step-num">1</span><span>${escapeHtml(state.step1)}</span></div>
          <div class="step-item"><span class="step-num">2</span><span>${escapeHtml(state.step2)}</span></div>
          <div class="step-item"><span class="step-num">3</span><span>${escapeHtml(state.step3)}</span></div>
          <div class="step-item"><span class="step-num">4</span><span>${escapeHtml(state.step4)}</span></div>
        </div>
      `;
    }else if(sec.type === "booking"){
      wrap.innerHTML = `
        <div class="live-booking">
          <h3>ناونووسین و حجزکردن</h3>
          <p style="color:${state.bookingOpen ? 'var(--success)' : 'var(--danger)'};font-weight:700">
            ${state.bookingOpen ? "دەرگای ناونووسین کراوەیە ✓" : "ناونووسین داخراوە ✕"}
          </p>
        </div>
      `;
    }else{
      wrap.innerHTML = `
        <div style="padding:30px 20px;text-align:center;border-bottom:1px solid var(--border)">
          <h3>${escapeHtml(sec.title || sec.type)}</h3>
        </div>
      `;
    }
    live.appendChild(wrap);
  });
}

/* 3. INSPECTOR */
function renderInspector(){
  const body = document.getElementById("inspectorContent");
  const sec = state.sections.find(s => s.id === selectedId);
  if(!sec){
    body.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 10px;">بەشێک لە تابەکانی پێشوو هەڵبژێرە</div>`;
    document.getElementById("activeSecType").textContent = "هیچ";
    return;
  }

  document.getElementById("activeSecType").textContent = sec.title || sec.type;
  let html = `
    <div class="form-group">
      <label>ناوی بەش لە پێڕست</label>
      <input class="input" id="inp_secTitle" value="${escapeAttr(sec.title)}">
    </div>
  `;

  if(sec.type === "hero"){
    html += `
      <div class="form-group">
        <label>ڕەنگەکانی تێکەڵاو (Gradient)</label>
        <div class="color-pair">
          <div class="color-ctrl"><input type="color" id="inp_c1" value="${state.gradColor1}"><span>ڕەنگی سەرەکی</span></div>
          <div class="color-ctrl"><input type="color" id="inp_c2" value="${state.gradColor2}"><span>ڕەنگی ژێرەوە</span></div>
        </div>
      </div>
      <div class="form-group"><label>Hero Badge</label><input class="input" id="inp_heroBadge" value="${escapeAttr(state.heroBadge)}"></div>
      <div class="form-group"><label>سەردێڕی سەرەکی (Hero Title)</label><input class="input" id="inp_heroTitle" value="${escapeAttr(state.heroTitle)}"></div>
      <div class="form-group"><label>دەقی لاوەکی (Subtitle)</label><textarea class="textarea" id="inp_heroSubtitle">${escapeHtml(state.heroSubtitle)}</textarea></div>
      <div class="form-group">
        <label>وێنەی پێشەوە (Hero Image)</label>
        <div style="display:flex;gap:6px">
          <input class="input" id="inp_heroImageUrl" value="${escapeAttr(state.heroImageUrl)}" placeholder="لینکی وێنە">
          <button class="btn" id="uploadHeroImgBtn" style="padding:0 14px">📷 بارکردن</button>
          <input type="file" id="heroFileInput" accept="image/*" hidden>
        </div>
      </div>
    `;
  }else if(sec.type === "trip"){
    html += `
      <div class="form-group"><label>ناوی گەشت (Title)</label><input class="input" id="inp_tripTitle" value="${escapeAttr(state.tripTitle)}"></div>
      <div class="form-group"><label>نرخ</label><input class="input" id="inp_tripPrice" value="${escapeAttr(state.tripPrice)}"></div>
      <div class="form-group"><label>ئاستی گەشت</label><input class="input" id="inp_tripDiff" value="${escapeAttr(state.tripDifficulty)}"></div>
      <div class="form-group"><label>ماوە</label><input class="input" id="inp_tripDur" value="${escapeAttr(state.tripDuration)}"></div>
      <div class="form-group"><label>کاتژمێر</label><input class="input" id="inp_tripTime" value="${escapeAttr(state.tripTime)}"></div>
      <div class="form-group"><label>شوێن</label><input class="input" id="inp_tripLoc" value="${escapeAttr(state.tripLocation)}"></div>
      <div class="form-group"><label>دەربارەی گەشت</label><textarea class="textarea" id="inp_tripDesc">${escapeHtml(state.tripDesc)}</textarea></div>
    `;
  }else if(sec.type === "services"){
    html += `
      <div class="form-group"><label>هەنگاوی ١</label><input class="input" id="inp_step1" value="${escapeAttr(state.step1)}"></div>
      <div class="form-group"><label>هەنگاوی ٢</label><input class="input" id="inp_step2" value="${escapeAttr(state.step2)}"></div>
      <div class="form-group"><label>هەنگاوی ٣</label><input class="input" id="inp_step3" value="${escapeAttr(state.step3)}"></div>
      <div class="form-group"><label>هەنگاوی ٤</label><input class="input" id="inp_step4" value="${escapeAttr(state.step4)}"></div>
    `;
  }else if(sec.type === "booking"){
    html += `
      <div class="form-group">
        <label>دۆخی حجز و ناونووسین</label>
        <select class="select" id="inp_bookingOpen">
          <option value="true" ${state.bookingOpen ? "selected":""}>کراوە بێت (Open)</option>
          <option value="false" ${!state.bookingOpen ? "selected":""}>داخراو بێت (Closed)</option>
        </select>
      </div>
    `;
  }

  html += `<button class="btn btn-primary" style="width:100%;margin-top:14px;padding:12px" id="applyInspectorBtn">✓ جێبەجێکردن لە Preview</button>`;
  body.innerHTML = html;

  document.getElementById("applyInspectorBtn").onclick = ()=>{
    const updated = structuredClone(state);
    const targetSec = updated.sections.find(s=>s.id === selectedId);
    if(targetSec) targetSec.title = document.getElementById("inp_secTitle").value;

    if(sec.type === "hero"){
      updated.gradColor1 = document.getElementById("inp_c1").value;
      updated.gradColor2 = document.getElementById("inp_c2").value;
      updated.heroBadge = document.getElementById("inp_heroBadge").value;
      updated.heroTitle = document.getElementById("inp_heroTitle").value;
      updated.heroSubtitle = document.getElementById("inp_heroSubtitle").value;
      updated.heroImageUrl = document.getElementById("inp_heroImageUrl").value;
    }else if(sec.type === "trip"){
      updated.tripTitle = document.getElementById("inp_tripTitle").value;
      updated.tripPrice = document.getElementById("inp_tripPrice").value;
      updated.tripDifficulty = document.getElementById("inp_tripDiff").value;
      updated.tripDuration = document.getElementById("inp_tripDur").value;
      updated.tripTime = document.getElementById("inp_tripTime").value;
      updated.tripLocation = document.getElementById("inp_tripLoc").value;
      updated.tripDesc = document.getElementById("inp_tripDesc").value;
    }else if(sec.type === "services"){
      updated.step1 = document.getElementById("inp_step1").value;
      updated.step2 = document.getElementById("inp_step2").value;
      updated.step3 = document.getElementById("inp_step3").value;
      updated.step4 = document.getElementById("inp_step4").value;
    }else if(sec.type === "booking"){
      updated.bookingOpen = document.getElementById("inp_bookingOpen").value === "true";
    }

    pushState(updated);
    toast("دەستکارییەکان پاشەکەوت کران ✓");
    document.querySelector('[data-target="tab-preview"]').click();
  };

  const upBtn = document.getElementById("uploadHeroImgBtn");
  if(upBtn){
    const fileInp = document.getElementById("heroFileInput");
    upBtn.onclick = ()=> fileInp.click();
    fileInp.onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      toast("خەریکی بارکردنی وێنەیە بۆ ImgBB...");
      const fd = new FormData();
      fd.append("image", file);
      try{
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:"POST", body:fd });
        const data = await res.json();
        if(data.success){
          document.getElementById("inp_heroImageUrl").value = data.data.url;
          toast("وێنەکە بارکرا ✓");
        }else toast("هەڵە لە بارکردنی وێنە");
      }catch(err){ toast("کێشەی پەیوەندی هەیە"); }
    };
  }
}

/* ADD SECTION */
document.getElementById("addSectionBtn").onclick = ()=>{
  const newId = "sec_" + Date.now();
  const updated = structuredClone(state);
  updated.sections.push({ id: newId, type: "custom", title: "بەشی نوێ", visible: true });
  switchToInspector(newId);
  pushState(updated);
  toast("بەشی نوێ زیادکرا");
};

/* VIEWPORT BUTTONS */
document.querySelectorAll(".view-btn").forEach(btn => {
  btn.onclick = ()=>{
    document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const frame = document.getElementById("siteFrame");
    frame.style.maxWidth = btn.dataset.view === "desktop" ? "100%" : (btn.dataset.view === "tablet" ? "768px" : "420px");
  };
});

/* DRAFT & PUBLISH */
document.getElementById("saveDraftBtn").onclick = ()=>{
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  toast("درافت پاشەکەوت کرا ✓");
};

document.getElementById("publishBtn").onclick = async ()=>{
  localStorage.setItem(PUBLISHED_KEY, JSON.stringify(state));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  toast("خەریکی بڵاوکردنەوەیە لە سەر سێرڤەر...");

  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Access-Key": API_KEY
      },
      body: JSON.stringify(state)
    });
    if(res.ok){
      toast("🚀 وێبسایت بە سەرکەوتوویی Publish کرا");
    }else{
      toast("لە مۆبایل پاشەکەوت بوو، هەڵە لە سێرڤەر!");
    }
  }catch(e){
    toast("لە مۆبایل پاشەکەوت کرا (ئۆفلاین)");
  }
};

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__tTimer);
  window.__tTimer = setTimeout(()=>{ t.classList.remove("show"); }, 2400);
}

function escapeHtml(s){ return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
function escapeAttr(s){ return escapeHtml(s); }

renderAll();
</script>
</body>
</html>
