<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KURDIA ADMIN</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0f19;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .box {
            width: min(90%, 500px);
            padding: 40px 25px;
            border: 1px solid #2a3242;
            border-radius: 24px;
            background: #111827;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            color: #aeb7c7;
            line-height: 1.8;
        }

        .status {
            margin-top: 25px;
            padding: 14px;
            border-radius: 14px;
            background: #182235;
            color: #d8dee9;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>KURDIA ADMIN</h1>
    <p>بەخێربێیت بۆ بەڕێوەبردنی KURDIA ADVENTURE</p>

    <div class="status">
        ✅ Android App بە سەرکەوتوویی دامەزرا
    </div>
</div>

</body>
</html>
