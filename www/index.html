<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>KURDIA ADMIN - Smart Website Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{
  --bg:#080b12;
  --panel:#111722;
  --panel2:#161e2b;
  --border:#202938;
  --text:#f5f5f5;
  --muted:#8e99aa;
  --accent:#9d1c32;
  --accent-hover:#b3223b;
  --success:#22c55e;
  --danger:#ef4444;
  --warning:#f59e0b;
}

body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Vazirmatn",sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

button,input,textarea,select{font-family:inherit}
button{cursor:pointer;border:0;outline:none}

/* HEADER */
.topbar{
  height:64px;
  background:rgba(17,23,34,0.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  z-index:30;
  flex-shrink:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand .logo{
  width:36px;
  height:36px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#500e19);
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:16px;
}
.brand h1{
  font-size:15px;
  margin:0;
  font-weight:800;
}
.brand small{
  color:var(--muted);
  font-size:11px;
  display:block;
}

.actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  padding:8px 12px;
  border-radius:9px;
  background:var(--panel2);
  color:#fff;
  border:1px solid var(--border);
  font-size:12px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:.2s;
}
.btn:hover{background:#232d3d}
.btn-primary{background:var(--accent);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-success{background:#123026;border-color:#205842;color:#8ff0bd}
.btn-danger{background:#35131b;border-color:#63202d;color:#ff9baa}

/* MAIN LAYOUT */
.builder{
  flex:1;
  display:grid;
  grid-template-columns:290px minmax(0,1fr) 340px;
  min-height:0;
}

/* SIDEBAR: SECTIONS */
.sections-pane{
  background:var(--panel);
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.pane-title{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-list{
  padding:12px;
  overflow-y:auto;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.sec-card{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:grab;
  transition:.2s;
}
.sec-card:hover{border-color:#3a475c}
.sec-card.active{border-color:var(--accent);background:rgba(157,28,50,0.12)}
.sec-card.hidden-sec{opacity:0.45}

.sec-card-info{
  display:flex;
  align-items:center;
  gap:9px;
}
.drag-handle{color:var(--muted);font-size:14px}
.sec-card-name{font-size:13px;font-weight:600}
.sec-card-type{font-size:10px;color:var(--muted);display:block}

.sec-card-btns{display:flex;gap:4px}
.icon-btn{
  width:28px;
  height:28px;
  border-radius:7px;
  background:var(--panel2);
  color:#ccc;
  display:grid;
  place-items:center;
  font-size:11px;
}
.icon-btn:hover{background:#2a3649;color:#fff}

/* CANVAS & PREVIEW */
.canvas-pane{
  background:#05070a;
  display:flex;
  flex-direction:column;
  min-height:0;
  position:relative;
}

.viewport-bar{
  height:44px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:rgba(10,14,20,0.7);
}

.view-btn{
  padding:5px 12px;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
}
.view-btn.active{
  background:var(--panel2);
  color:#fff;
  border:1px solid var(--border);
}

.preview-container{
  flex:1;
  overflow:auto;
  display:flex;
  justify-content:center;
  padding:20px;
}

.site-frame{
  background:#080b12;
  border-radius:18px;
  box-shadow:0 15px 50px rgba(0,0,0,0.6);
  border:1px solid var(--border);
  width:100%;
  max-width:980px;
  overflow-y:auto;
  transition:max-width .3s ease;
  position:relative;
}
.site-frame.tablet{max-width:768px}
.site-frame.mobile{max-width:390px;border-radius:24px}

/* LIVE PREVIEW COMPONENTS */
.live-sec{
  position:relative;
  outline:2px solid transparent;
  transition:.15s;
  cursor:pointer;
}
.live-sec:hover{outline:2px dashed rgba(157,28,50,0.6)}
.live-sec.selected{outline:2px solid var(--accent)}

.live-hero{
  padding:60px 24px;
  color:#fff;
  background-size:cover;
  background-position:center;
  text-align:right;
}
.live-badge{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  padding:4px 10px;
  border-radius:99px;
  font-size:11px;
  margin-bottom:12px;
}
.live-hero h2{font-size:32px;margin:0 0 10px;line-height:1.3}
.live-hero p{color:#d1d5db;font-size:14px;margin:0;line-height:1.7}

.live-trip{
  padding:30px 24px;
  background:rgba(22,30,43,0.6);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.trip-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-top:15px;
}
.trip-box{
  background:var(--bg);
  padding:10px;
  border-radius:9px;
  border:1px solid var(--border);
}
.trip-box span{font-size:11px;color:var(--muted);display:block}
.trip-box b{font-size:13px}

.live-steps{
  padding:30px 24px;
}
.step-item{
  display:flex;
  gap:12px;
  margin-bottom:12px;
  background:var(--panel2);
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
}
.step-num{
  background:var(--accent);
  width:26px;
  height:26px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:700;
  flex-shrink:0;
}

.live-booking{
  padding:30px 24px;
  text-align:center;
  background:linear-gradient(180deg,transparent,rgba(157,28,50,0.15));
}

/* INSPECTOR PANE */
.inspector-pane{
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.inspector-body{
  padding:16px;
  overflow-y:auto;
  flex:1;
}

.form-group{
  margin-bottom:14px;
}
.form-group label{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-bottom:6px;
  font-weight:600;
}
.input, .textarea, .select{
  width:100%;
  background:#090d14;
  border:1px solid var(--border);
  color:#fff;
  border-radius:8px;
  padding:9px 12px;
  font-size:12px;
  outline:none;
}
.input:focus, .textarea:focus{border-color:var(--accent)}
.textarea{min-height:75px;resize:vertical}

.color-pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.color-ctrl{
  display:flex;
  align-items:center;
  gap:8px;
  background:#090d14;
  padding:6px;
  border-radius:8px;
  border:1px solid var(--border);
}
.color-ctrl input[type=color]{
  width:32px;
  height:30px;
  border:0;
  border-radius:6px;
  background:none;
  cursor:pointer;
}

.upload-ctrl{
  display:flex;
  gap:6px;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:20px;
  background:#17202d;
  color:#fff;
  border:1px solid var(--border);
  padding:10px 18px;
  border-radius:10px;
  font-size:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  transform:translateY(80px);
  opacity:0;
  transition:.25s ease;
  z-index:9999;
}
.toast.show{transform:translateY(0);opacity:1}

@media(max-width:900px){
  .builder{grid-template-columns:1fr;overflow:auto}
  .sections-pane, .inspector-pane{height:auto;border:0}
  .site-frame{max-width:100% !important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">K</div>
    <div>
      <h1>KURDIA ADMIN</h1>
      <small>Smart Website Builder</small>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="undoBtn">↶ Undo</button>
    <button class="btn" id="redoBtn">↷ Redo</button>
    <button class="btn" id="saveDraftBtn">💾 Save Draft</button>
    <button class="btn btn-primary" id="publishBtn">🚀 Publish</button>
  </div>
</header>

<main class="builder">
  <!-- 1. SECTIONS LIST -->
  <aside class="sections-pane">
    <div class="pane-title">
      <span>بەشەکانی وێبسایت</span>
      <span id="secCounter" style="color:var(--accent)">4</span>
    </div>
    <div class="section-list" id="sectionList"></div>
    <div style="padding:10px 12px;border-top:1px solid var(--border)">
      <button class="btn btn-primary" style="width:100%" id="addSectionBtn">＋ زیادکردنی بەش</button>
    </div>
  </aside>

  <!-- 2. CANVAS & PREVIEW -->
  <section class="canvas-pane">
    <div class="viewport-bar">
      <button class="view-btn active" data-view="desktop">🖥 Desktop</button>
      <button class="view-btn" data-view="tablet">▣ Tablet</button>
      <button class="view-btn" data-view="mobile">📱 Mobile</button>
    </div>
    <div class="preview-container">
      <div class="site-frame" id="siteFrame">
        <!-- Rendered Sections -->
        <div id="livePreview"></div>
      </div>
    </div>
  </section>

  <!-- 3. INSPECTOR -->
  <aside class="inspector-pane">
    <div class="pane-title">
      <span>دەستکاریکردن (Inspector)</span>
      <span id="activeSecType" style="color:var(--muted)">هیچ</span>
    </div>
    <div class="inspector-body" id="inspectorContent">
      <div style="text-align:center;color:var(--muted);padding:30px 10px;font-size:12px">
        بەشێک هەڵبژێرە بۆ دەستکاریکردنی فیلدەکان
      </div>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";

const BIN_ID = "6ab7f417ac6210605af863a3";
const API_KEY = "$2a$10$8avc1KliyAqa2Nof1YPm8eks0PGlSxSbJse5LUrK5irHtbVfhu.WW";
const IMGBB_KEY = "c89b7b9f5eaae43bce82e66b4d3f572a";

const STORAGE_KEY = "kurdia_builder_draft_v3";
const PUBLISHED_KEY = "kurdia_builder_published_v3";

const DEFAULT_DATA = {
  gradColor1: "#9d1c32",
  gradColor2: "#111827",
  heroBadge: "KURDIA ADVENTURE",
  heroTitle: "ئەزموونی سروشت و شاخ لە کوردستان",
  heroSubtitle: "لەگەڵ ئێمە یادەوەریی تایبەت و سروشتی نەبینراو ببینە",
  heroImageUrl: "",
  bookingOpen: true,
  tripTitle: "گەشتی تایبەت",
  tripPrice: "50,000 IQD",
  tripDifficulty: "ئاسان",
  tripDuration: "1 ڕۆژ",
  tripTime: "06:00",
  tripLocation: "کوردستان",
  tripDesc: "گەشتێکی پڕ لە چێژ و بینینی دیمەنە ناوازەکانی سروشت.",
  step1: "پەیوەندی و ناونووسین",
  step2: "ئامادەکاری پێداویستییەکان",
  step3: "بەڕێکەوتن بەرەو شوێنی گەشت",
  step4: "چێژوەرگرتن لە سروشت",
  seoTitle: "KURDIA ADVENTURE",
  seoDescription: "گەشتی سروشت و شاخ لە کوردستان",
  socialImage: "",
  gallery: [],
  sections: [
    { id: "hero_1", type: "hero", title: "Hero", visible: true },
    { id: "trip_1", type: "trip", title: "گەشت", visible: true },
    { id: "services_1", type: "services", title: "هەنگاوەکان", visible: true },
    { id: "booking_1", type: "booking", title: "Booking", visible: true }
  ]
};

let state = loadInitialState();
let selectedId = state.sections[0]?.id || null;

// History for Undo/Redo
let historyStack = [JSON.stringify(state)];
let historyIndex = 0;

function pushState(newState){
  if(historyIndex < historyStack.length - 1){
    historyStack = historyStack.slice(0, historyIndex + 1);
  }
  historyStack.push(JSON.stringify(newState));
  historyIndex++;
  state = newState;
  renderAll();
}

function undo(){
  if(historyIndex > 0){
    historyIndex--;
    state = JSON.parse(historyStack[historyIndex]);
    renderAll();
    toast("گەڕایەوە دواوە ↶");
  }
}

function redo(){
  if(historyIndex < historyStack.length - 1){
    historyIndex++;
    state = JSON.parse(historyStack[historyIndex]);
    renderAll();
    toast("چووە پێشەوە ↷");
  }
}

document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;

function loadInitialState(){
  try{
    const draft = localStorage.getItem(STORAGE_KEY);
    if(draft) return Object.assign({}, DEFAULT_DATA, JSON.parse(draft));
    const pub = localStorage.getItem(PUBLISHED_KEY);
    if(pub) return Object.assign({}, DEFAULT_DATA, JSON.parse(pub));
  }catch(e){}
  return structuredClone(DEFAULT_DATA);
}

function renderAll(){
  renderSectionList();
  renderLivePreview();
  renderInspector();
}

/* 1. SECTIONS LIST RENDERING & DRAG/DROP */
function renderSectionList(){
  const list = document.getElementById("sectionList");
  list.innerHTML = "";
  document.getElementById("secCounter").textContent = state.sections.length;

  state.sections.forEach((sec, idx)=>{
    const el = document.createElement("div");
    el.className = "sec-card " + (sec.id === selectedId ? "active ":"") + (!sec.visible ? "hidden-sec":"");
    el.draggable = true;
    el.dataset.id = sec.id;

    el.innerHTML = `
      <div class="sec-card-info">
        <span class="drag-handle">☰</span>
        <div>
          <span class="sec-card-name">${escapeHtml(sec.title || sec.type)}</span>
          <span class="sec-card-type">${sec.type}</span>
        </div>
      </div>
      <div class="sec-card-btns">
        <button class="icon-btn vis-btn">${sec.visible ? "◉":"○"}</button>
        <button class="icon-btn del-btn">×</button>
      </div>
    `;

    el.onclick = (e)=>{
      if(e.target.closest("button")) return;
      selectedId = sec.id;
      renderAll();
    };

    el.querySelector(".vis-btn").onclick = (e)=>{
      e.stopPropagation();
      const updated = structuredClone(state);
      updated.sections[idx].visible = !updated.sections[idx].visible;
      pushState(updated);
    };

    el.querySelector(".del-btn").onclick = (e)=>{
      e.stopPropagation();
      if(state.sections.length <= 1) return toast("دەبێت لانیکەم یەک بەش بمێنێتەوە");
      const updated = structuredClone(state);
      updated.sections.splice(idx, 1);
      if(selectedId === sec.id) selectedId = updated.sections[0]?.id;
      pushState(updated);
    };

    // Drag events
    el.ondragstart = (e)=>{ e.dataTransfer.setData("text/plain", sec.id); };
    el.ondragover = (e)=>{ e.preventDefault(); };
    el.ondrop = (e)=>{
      e.preventDefault();
      const fromId = e.dataTransfer.getData("text/plain");
      if(!fromId || fromId === sec.id) return;
      const updated = structuredClone(state);
      const fIdx = updated.sections.findIndex(x=>x.id === fromId);
      const tIdx = updated.sections.findIndex(x=>x.id === sec.id);
      const [moved] = updated.sections.splice(fIdx, 1);
      updated.sections.splice(tIdx, 0, moved);
      pushState(updated);
    };

    list.appendChild(el);
  });
}

/* 2. LIVE PREVIEW RENDERING */
function renderLivePreview(){
  const live = document.getElementById("livePreview");
  live.innerHTML = "";

  state.sections.filter(s => s.visible).forEach(sec => {
    const wrap = document.createElement("div");
    wrap.className = "live-sec " + (sec.id === selectedId ? "selected" : "");
    wrap.onclick = ()=>{ selectedId = sec.id; renderAll(); };

    if(sec.type === "hero"){
      const bgImg = state.heroImageUrl ? `url('${state.heroImageUrl}')` : `none`;
      wrap.innerHTML = `
        <div class="live-hero" style="background:linear-gradient(135deg, ${state.gradColor1}dd, ${state.gradColor2}ee), ${bgImg} center/cover;">
          <span class="live-badge">${escapeHtml(state.heroBadge)}</span>
          <h2>${escapeHtml(state.heroTitle)}</h2>
          <p>${escapeHtml(state.heroSubtitle)}</p>
        </div>
      `;
    }else if(sec.type === "trip"){
      wrap.innerHTML = `
        <div class="live-trip">
          <h3 style="margin:0 0 10px">${escapeHtml(state.tripTitle)}</h3>
          <p style="color:var(--muted);font-size:13px;margin:0">${escapeHtml(state.tripDesc)}</p>
          <div class="trip-grid">
            <div class="trip-box"><span>نرخ</span><b>${escapeHtml(state.tripPrice)}</b></div>
            <div class="trip-box"><span>ئاست</span><b>${escapeHtml(state.tripDifficulty)}</b></div>
            <div class="trip-box"><span>ماوە</span><b>${escapeHtml(state.tripDuration)}</b></div>
            <div class="trip-box"><span>کات</span><b>${escapeHtml(state.tripTime)}</b></div>
            <div class="trip-box"><span>شوێن</span><b>${escapeHtml(state.tripLocation)}</b></div>
          </div>
        </div>
      `;
    }else if(sec.type === "services"){
      wrap.innerHTML = `
        <div class="live-steps">
          <h4 style="margin:0 0 14px">قۆناغ و هەنگاوەکان</h4>
          <div class="step-item"><span class="step-num">1</span><span>${escapeHtml(state.step1)}</span></div>
          <div class="step-item"><span class="step-num">2</span><span>${escapeHtml(state.step2)}</span></div>
          <div class="step-item"><span class="step-num">3</span><span>${escapeHtml(state.step3)}</span></div>
          <div class="step-item"><span class="step-num">4</span><span>${escapeHtml(state.step4)}</span></div>
        </div>
      `;
    }else if(sec.type === "booking"){
      wrap.innerHTML = `
        <div class="live-booking">
          <h3>ناونووسین و حجزکردن</h3>
          <p style="color:${state.bookingOpen ? 'var(--success)' : 'var(--danger)'};font-weight:700">
            ${state.bookingOpen ? "دەرگای ناونووسین کراوەیە ✓" : "ناونووسین داخراوە ✕"}
          </p>
        </div>
      `;
    }else{
      wrap.innerHTML = `
        <div style="padding:30px 20px;text-align:center;border-bottom:1px solid var(--border)">
          <h3>${escapeHtml(sec.title || sec.type)}</h3>
          <p style="color:var(--muted)">بەشی نوێ</p>
        </div>
      `;
    }
    live.appendChild(wrap);
  });
}

/* 3. INSPECTOR RENDERING */
function renderInspector(){
  const body = document.getElementById("inspectorContent");
  const sec = state.sections.find(s => s.id === selectedId);
  if(!sec){
    body.innerHTML = `<div style="text-align:center;color:var(--muted);padding:30px 10px;">بەشێک هەڵبژێرە</div>`;
    document.getElementById("activeSecType").textContent = "هیچ";
    return;
  }

  document.getElementById("activeSecType").textContent = sec.type;
  let html = `
    <div class="form-group">
      <label>ناوی بەش لە پێڕست</label>
      <input class="input" id="inp_secTitle" value="${escapeAttr(sec.title)}">
    </div>
  `;

  if(sec.type === "hero"){
    html += `
      <div class="form-group">
        <label>ڕەنگەکانی Gradient</label>
        <div class="color-pair">
          <div class="color-ctrl"><input type="color" id="inp_c1" value="${state.gradColor1}"><span>Color 1</span></div>
          <div class="color-ctrl"><input type="color" id="inp_c2" value="${state.gradColor2}"><span>Color 2</span></div>
        </div>
      </div>
      <div class="form-group">
        <label>Hero Badge</label>
        <input class="input" id="inp_heroBadge" value="${escapeAttr(state.heroBadge)}">
      </div>
      <div class="form-group">
        <label>ناونیشانی سەرەکی (Hero Title)</label>
        <input class="input" id="inp_heroTitle" value="${escapeAttr(state.heroTitle)}">
      </div>
      <div class="form-group">
        <label>سەردێڕی دووەم (Subtitle)</label>
        <textarea class="textarea" id="inp_heroSubtitle">${escapeHtml(state.heroSubtitle)}</textarea>
      </div>
      <div class="form-group">
        <label>وێنەی پێشەوە (Hero Image)</label>
        <div class="upload-ctrl">
          <input class="input" id="inp_heroImageUrl" value="${escapeAttr(state.heroImageUrl)}" placeholder="URL">
          <button class="btn" id="uploadHeroImgBtn">📷</button>
          <input type="file" id="heroFileInput" accept="image/*" hidden>
        </div>
      </div>
    `;
  }else if(sec.type === "trip"){
    html += `
      <div class="form-group"><label>ناوی گەشت (Title)</label><input class="input" id="inp_tripTitle" value="${escapeAttr(state.tripTitle)}"></div>
      <div class="form-group"><label>نرخ</label><input class="input" id="inp_tripPrice" value="${escapeAttr(state.tripPrice)}"></div>
      <div class="form-group"><label>ئاستی گەشت</label><input class="input" id="inp_tripDiff" value="${escapeAttr(state.tripDifficulty)}"></div>
      <div class="form-group"><label>ماوە</label><input class="input" id="inp_tripDur" value="${escapeAttr(state.tripDuration)}"></div>
      <div class="form-group"><label>کاتژمێر</label><input class="input" id="inp_tripTime" value="${escapeAttr(state.tripTime)}"></div>
      <div class="form-group"><label>شوێن</label><input class="input" id="inp_tripLoc" value="${escapeAttr(state.tripLocation)}"></div>
      <div class="form-group"><label>دەربارەی گەشت (تێبینی)</label><textarea class="textarea" id="inp_tripDesc">${escapeHtml(state.tripDesc)}</textarea></div>
    `;
  }else if(sec.type === "services"){
    html += `
      <div class="form-group"><label>هەنگاوی ١</label><input class="input" id="inp_step1" value="${escapeAttr(state.step1)}"></div>
      <div class="form-group"><label>هەنگاوی ٢</label><input class="input" id="inp_step2" value="${escapeAttr(state.step2)}"></div>
      <div class="form-group"><label>هەنگاوی ٣</label><input class="input" id="inp_step3" value="${escapeAttr(state.step3)}"></div>
      <div class="form-group"><label>هەنگاوی ٤</label><input class="input" id="inp_step4" value="${escapeAttr(state.step4)}"></div>
    `;
  }else if(sec.type === "booking"){
    html += `
      <div class="form-group">
        <label>دۆخی حجز و ناونووسین</label>
        <select class="select" id="inp_bookingOpen">
          <option value="true" ${state.bookingOpen ? "selected":""}>کراوە بێت (Open)</option>
          <option value="false" ${!state.bookingOpen ? "selected":""}>داخراو بێت (Closed)</option>
        </select>
      </div>
    `;
  }

  html += `<button class="btn btn-primary" style="width:100%;margin-top:10px" id="applyInspectorBtn">✓ نوێکردنەوە لە Preview</button>`;
  body.innerHTML = html;

  // Event handlers
  document.getElementById("applyInspectorBtn").onclick = ()=>{
    const updated = structuredClone(state);
    const targetSec = updated.sections.find(s=>s.id === selectedId);
    if(targetSec) targetSec.title = document.getElementById("inp_secTitle").value;

    if(sec.type === "hero"){
      updated.gradColor1 = document.getElementById("inp_c1").value;
      updated.gradColor2 = document.getElementById("inp_c2").value;
      updated.heroBadge = document.getElementById("inp_heroBadge").value;
      updated.heroTitle = document.getElementById("inp_heroTitle").value;
      updated.heroSubtitle = document.getElementById("inp_heroSubtitle").value;
      updated.heroImageUrl = document.getElementById("inp_heroImageUrl").value;
    }else if(sec.type === "trip"){
      updated.tripTitle = document.getElementById("inp_tripTitle").value;
      updated.tripPrice = document.getElementById("inp_tripPrice").value;
      updated.tripDifficulty = document.getElementById("inp_tripDiff").value;
      updated.tripDuration = document.getElementById("inp_tripDur").value;
      updated.tripTime = document.getElementById("inp_tripTime").value;
      updated.tripLocation = document.getElementById("inp_tripLoc").value;
      updated.tripDesc = document.getElementById("inp_tripDesc").value;
    }else if(sec.type === "services"){
      updated.step1 = document.getElementById("inp_step1").value;
      updated.step2 = document.getElementById("inp_step2").value;
      updated.step3 = document.getElementById("inp_step3").value;
      updated.step4 = document.getElementById("inp_step4").value;
    }else if(sec.type === "booking"){
      updated.bookingOpen = document.getElementById("inp_bookingOpen").value === "true";
    }

    pushState(updated);
    toast("دەستکارییەکان جێبەجێ کران ✓");
  };

  // Image Upload handler
  const upBtn = document.getElementById("uploadHeroImgBtn");
  if(upBtn){
    const fileInp = document.getElementById("heroFileInput");
    upBtn.onclick = ()=> fileInp.click();
    fileInp.onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      toast("خەریکی بارکردنی وێنەیە بۆ ImgBB...");
      const fd = new FormData();
      fd.append("image", file);
      try{
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:"POST", body:fd });
        const data = await res.json();
        if(data.success){
          document.getElementById("inp_heroImageUrl").value = data.data.url;
          toast("وێنەکە سەرکەوتووانە بارکرا ✓");
        }else toast("هەڵە لە بارکردنی وێنە");
      }catch(err){ toast("کێشەی پەیوەندی هەیە"); }
    };
  }
}

/* 4. ADD NEW SECTION */
document.getElementById("addSectionBtn").onclick = ()=>{
  const newId = "sec_" + Date.now();
  const updated = structuredClone(state);
  updated.sections.push({ id: newId, type: "custom", title: "بەشی نوێ", visible: true });
  selectedId = newId;
  pushState(updated);
  toast("بەشی نوێ زیادکرا");
};

/* 5. VIEWPORT TOGGLES */
document.querySelectorAll(".view-btn").forEach(btn => {
  btn.onclick = ()=>{
    document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const frame = document.getElementById("siteFrame");
    frame.className = "site-frame " + (btn.dataset.view === "tablet" ? "tablet" : btn.dataset.view === "mobile" ? "mobile" : "");
  };
});

/* 6. SAVE DRAFT & PUBLISH (JSONBin & LocalStorage) */
document.getElementById("saveDraftBtn").onclick = ()=>{
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  toast("درافت بە سەرکەوتوویی پاشەکەوت کرا ✓");
};

document.getElementById("publishBtn").onclick = async ()=>{
  localStorage.setItem(PUBLISHED_KEY, JSON.stringify(state));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  toast("خەریکی بڵاوکردنەوەیە لە JSONBin...");

  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Access-Key": API_KEY
      },
      body: JSON.stringify(state)
    });
    if(res.ok){
      toast("🚀 وێبسایت بە سەرکەوتوویی بڵاوکرایەوە (Published)");
    }else{
      toast("پاشەکەوت بوو، بەڵام هەڵە لە هەور هەیە!");
    }
  }catch(e){
    toast("وێبسایت لە ئامێرەکە پاشەکەوت بوو (Offline)");
  }
};

/* HELPERS */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__tTimer);
  window.__tTimer = setTimeout(()=>{ t.classList.remove("show"); }, 2400);
}

function escapeHtml(s){ return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
function escapeAttr(s){ return escapeHtml(s); }

// INIT
renderAll();
</script>
</body>
</html>
